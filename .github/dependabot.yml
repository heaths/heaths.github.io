version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-minor-days: 7
    groups:
      node-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-minor-days: 7
    groups:
      ruby-dependencies:
        patterns:
          - "*"
        applies-to: security-updates
        update-types:
          - minor
          - patch
