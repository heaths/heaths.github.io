name: Deploy Hugo site to Pages

env:
  HUGO_VERSION: 0.170.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

# Deployments queue without cancellation; pull request builds only cancel themselves.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          mkdir hugo
          tar -C hugo -xf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${{ runner.temp }}/hugo" >> "$GITHUB_PATH"
      - name: Install support tooling
        run: npm ci
      - name: Restore Hugo cache
        id: hugo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.cache/hugo
            resources/_gen
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-
      - name: Build and check with Hugo
        run: npm test
        env:
          HUGO_BASEURL: "${{ steps.pages.outputs.base_url || 'https://heaths.dev' }}/"
          HUGO_CACHEDIR: "${{ runner.temp }}/.cache/hugo"
      - name: Save Hugo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.cache/hugo
            resources/_gen
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
